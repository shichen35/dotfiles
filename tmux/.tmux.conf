# Terminal: true color, extended keys (CSI u), focus events
set -g default-terminal "tmux-256color"
# macOS system ncurses may lack tmux-256color terminfo; fall back so vim/less inside still work
if '! infocmp tmux-256color >/dev/null 2>&1' 'set -g default-terminal "screen-256color"'
set -as terminal-features ",xterm*:RGB,alacritty*:RGB,*256col*:RGB"
set -s extended-keys on
set -s extended-keys-format csi-u
set -s escape-time 10
set -g focus-events on

set -g history-limit 50000
set -g mouse on
set -g mode-keys vi
set -g status-keys vi
set -g repeat-time 500
set -g display-time 4000
setw -g aggressive-resize on

# Numbering from 1, keep it contiguous
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Panes
bind -r C-h select-pane -L
bind -r C-j select-pane -D
bind -r C-k select-pane -U
bind -r C-l select-pane -R

bind -r h resize-pane -L 5
bind -r j resize-pane -D 5
bind -r k resize-pane -U 5
bind -r l resize-pane -R 5
bind m resize-pane -Z
bind = select-layout tiled
bind C-p previous-window
bind C-n next-window

# New splits/windows open in the current directory
bind '"' split-window -v -c "#{pane_current_path}"
bind %   split-window -h -c "#{pane_current_path}"
bind c   new-window -c "#{pane_current_path}"

bind R source-file ~/.tmux.conf \; display-message "tmux.conf reloaded."
bind S setw synchronize-panes

# Copy mode: OSC 52 to the outer terminal (works over SSH),
# plus the local clipboard tool if present. y/Enter/mouse drag all use copy-command.
set -s set-clipboard on
if -b "command -v wl-copy" "set -s copy-command 'wl-copy'"
if -b "command -v pbcopy"  "set -s copy-command 'pbcopy'"
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y send -X copy-pipe-and-cancel

# Status bar
set -g status-interval 1
set -g status-style bg=black,fg=white
set -g status-left ''
set -g status-right '%a %H:%M:%S #[fg=blue]%Y-%m-%d#[default]#{?pane_synchronized, #[fg=green]SYNC#[default],}'

# Activity notifications
setw -g monitor-activity on
set -g visual-activity on

# Plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
# set -g @plugin 'tmux-plugins/tmux-continuum'
# set -g @continuum-restore 'on'

# Keep at the very bottom
run '~/.tmux/plugins/tpm/tpm'
